[tool.poetry]
name = "jsktoolbox"
version = "1.2.12"
description = "Python utility library providing typed helpers for system operations, configuration parsing, logging pipelines, IPv4/IPv6 address handling, MikroTik/RouterOS support, and Tkinter components."
authors = ["Jacek 'Szumak' Kotlarski <szumak@virthost.pl>"]
maintainers = ["Jacek 'Szumak' Kotlarski <szumak@virthost.pl>"]
license = "MIT"
readme = "README.md"
keywords = [
        "python",
        "utilities",
        "automation",
        "networking",
        "ipv4",
        "ipv6",
        "configuration",
        "logging",
        "mikrotik",
        "routeros",
        "tkinter"
]
repository = "https://github.com/Szumak75/JskToolBox"
homepage = "https://github.com/Szumak75/JskToolBox"
documentation = "https://jsktoolbox.readthedocs.io/"
classifiers = [
        "Intended Audience :: Developers",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Software Development :: Libraries",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Topic :: System :: Networking",
        "Topic :: System :: Systems Administration",
        "Topic :: Utilities"
]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.33.0"
urllib3 = "^2.6.3"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
pytest = "^9.0.2"
typing-extensions = "^4.15.0"
pycodestyle = "^2.14.0"
pydocstyle = "^6.3.0"
sphinx = ">=7.4.7,<8"
# sphinx-autodoc-typehints removed - using built-in sphinx.ext.autodoc.typehints instead
sphinx-rtd-theme = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
generate-docs = "generate_docs:main"

[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.venv313
  | _build
  | buck-out
  | build
  | dist
  | examples
)/
'''
